apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: pulsehr-hpa
  namespace: pulsehr
  labels:
    app: pulsehr
    app.kubernetes.io/name: pulsehr
    app.kubernetes.io/component: autoscaler
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: pulsehr-deployment
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

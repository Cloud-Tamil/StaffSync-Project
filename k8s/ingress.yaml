apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pulsehr-ingress
  namespace: pulsehr
  labels:
    app: pulsehr
    app.kubernetes.io/name: pulsehr
    app.kubernetes.io/component: ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pulsehr-service
                port:
                  number: 80
